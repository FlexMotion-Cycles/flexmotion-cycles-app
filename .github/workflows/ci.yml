name: CI FlexMotion Cycles

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Criar .env a partir do exemplo
        run: cp .env.example .env

      - name: Validar Compose
        run: docker compose config --quiet

      - name: Construir imagens
        run: docker compose build

      - name: Subir a stack
        run: docker compose up -d

      - name: Health check
        run: |
          BACKEND_HOST_PORT=$(grep -E '^BACKEND_HOST_PORT=' .env | cut -d= -f2)
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:${BACKEND_HOST_PORT}/actuator/health" && exit 0
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Fleet simulator check
        run: |
          for i in $(seq 1 20); do
            docker compose exec -T rabbitmq rabbitmqctl -q list_mqtt_connections client_id \
              | grep -q 'fleet-simulator-out' && exit 0
            sleep 3
          done
          docker compose logs fleet-simulator
          exit 1

      - name: Parar a stack
        if: always()
        run: docker compose down -v

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit and integration tests
        working-directory: projFlexMotion
        run: mvn -B verify

      - name: Import test results into Xray
        if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: mikepenz/xray-action@v4
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}
          testFormat: junit
          testPaths: projFlexMotion/target/TEST-junit-jupiter*.xml
          projectKey: FM
          testPlanKey: ${{ vars.XRAY_TEST_PLAN_KEY }}

      # Cucumber scenarios as Generic tests (simple flow); link them to the story once in Xray.
      - name: Import acceptance test results into Xray
        if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: mikepenz/xray-action@v4
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}
          testFormat: junit
          testPaths: projFlexMotion/target/failsafe-reports/TEST-*CucumberIT.xml
          projectKey: FM
          testPlanKey: ${{ vars.XRAY_TEST_PLAN_KEY }}

  simulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run fleet simulator tests
        working-directory: fleet-simulator
        run: mvn -B verify
