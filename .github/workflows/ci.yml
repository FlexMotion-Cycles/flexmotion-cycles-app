name: CI FlexMotion Cycles

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Criar .env a partir do exemplo
        run: cp .env.example .env

      - name: Validar Compose
        run: docker compose config --quiet

      - name: Construir imagens
        run: docker compose build

      - name: Subir a stack
        run: docker compose up -d

      - name: Health check
        run: |
          BACKEND_HOST_PORT=$(grep -E '^BACKEND_HOST_PORT=' .env | cut -d= -f2)
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:${BACKEND_HOST_PORT}/actuator/health" && exit 0
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Parar a stack
        if: always()
        run: docker compose down -v
