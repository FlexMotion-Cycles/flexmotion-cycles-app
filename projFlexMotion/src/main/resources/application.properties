spring.application.name=flexmotion-cycles

# Prototype schema management; to be replaced by migrations with CD (D4).
# The schema is generated from the JPA entities until the team adopts a migration tool.
spring.jpa.hibernate.ddl-auto=update

# Telemetry adapter: "fake" (tests, demo without simulator) or "mqtt" (RabbitMQ).
flexmotion.telemetry.adapter=${TELEMETRY_ADAPTER:fake}
# Fake only: answer every unlock command with an immediate lock-opened event (demo without simulator).
flexmotion.telemetry.fake.auto-confirm=true

# Pay-as-you-go pricing (BR7, BR17). The maximum trip duration is set by the client (BR18).
flexmotion.pricing.unlock-fee=1.00
flexmotion.pricing.per-minute-rate=0.15
flexmotion.pricing.overtime-rate=0.30
flexmotion.pricing.max-trip-minutes=90

# A lock closed within this distance of a conventional station is at one of its docks (BR9).
flexmotion.trip.dock-radius-meters=5

# Reservation of a conventional vehicle: exclusive hold and fixed fee (BR5, BR6).
flexmotion.reservation.hold=15m
flexmotion.reservation.fee=0.50
# How often due reservations are expired; a new reservation also expires them on the spot.
flexmotion.reservation.expiry-check-interval=PT10S

# Background jobs (@Scheduled); the "it" profile turns them off.
flexmotion.scheduling.enabled=true

spring.jpa.open-in-view=false

flexmotion.telemetry.broker-url=${MQTT_BROKER_URL}
flexmotion.telemetry.client-id=${MQTT_CLIENT_ID}
flexmotion.telemetry.username=${MQTT_USERNAME}
flexmotion.telemetry.password=${MQTT_PASSWORD}
flexmotion.telemetry.topic-prefix=${MQTT_TOPIC_PREFIX}
flexmotion.telemetry.command-topic-prefix=${MQTT_COMMAND_TOPIC_PREFIX}
flexmotion.telemetry.docking-radius-meters=10

# Temporary HTTP Basic account (until US-01) uses the end user features (US-02).
spring.security.user.roles=END_USER