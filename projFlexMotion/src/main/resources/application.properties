spring.application.name=flexmotion-cycles

# Prototype schema management; to be replaced by migrations with CD (D4).
# The schema is generated from the JPA entities until the team adopts a migration tool.
spring.jpa.hibernate.ddl-auto=update

# Telemetry adapter: "fake" until the MQTT adapter exists (US-08).
flexmotion.telemetry.adapter=fake
# Fake only: answer every unlock command with an immediate lock-opened event (demo without simulator).
flexmotion.telemetry.fake.auto-confirm=true

spring.jpa.open-in-view=false

flexmotion.telemetry.enabled=${MQTT_ENABLED:false}
flexmotion.telemetry.broker-url=${MQTT_BROKER_URL}
flexmotion.telemetry.client-id=${MQTT_CLIENT_ID}
flexmotion.telemetry.username=${MQTT_USERNAME}
flexmotion.telemetry.password=${MQTT_PASSWORD}
flexmotion.telemetry.topic-prefix=${MQTT_TOPIC_PREFIX}
